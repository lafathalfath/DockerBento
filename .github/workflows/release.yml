name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    runs-on: ubuntu-22.04  # older glibc = broader compatibility

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-wayland \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            wget \
            file \
            fuse \
            libfuse2

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Rename AppImage with version tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mv DockerBento-x86_64.AppImage DockerBento-${VERSION}-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockerBento-*.AppImage
          generate_release_notes: true
          body: |
            ## Installation

            Download `DockerBento-${{ github.ref_name }}-x86_64.AppImage`, then:

            ```bash
            chmod +x DockerBento-${{ github.ref_name }}-x86_64.AppImage
            ./DockerBento-${{ github.ref_name }}-x86_64.AppImage
            ```

            Requires: Linux x86_64, glibc 2.17+, Docker daemon running.
            Works on both Wayland and X11 sessions.
